name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit + API tests
        run: python -m pytest tests/ -q

      - name: End-to-end smoke test (real HTTP server)
        run: python scripts/smoke.py

      - name: Lint
        run: |
          pip install pyflakes
          python -m pyflakes app/ scripts/ tests/ || true
